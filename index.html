<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYED.exe</title>
<style>
body {
  background:#020403;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
  padding:25px 10px;
}
h1 {
  font-size:36px;
  text-shadow:0 0 15px #00ff66;
}
#screen {
  max-width:450px;
  margin:30px auto;
  padding:20px;
  border:1px solid #00ff66;
  box-shadow:0 0 15px #00ff66;
}
button {
  background:#001a0a;
  color:#00ff66;
  border:1px solid #00ff66;
  padding:15px 30px;
  font-size:18px;
}
#progress {
  width:100%;
  height:12px;
  border:1px solid #00ff66;
  margin-top:25px;
}
#bar {
  width:0%;
  height:100%;
  background:#00ff66;
  transition:width .15s;
}
#result {margin-top:25px;font-size:18px}
#logs {text-align:left;font-size:12px}
</style>
</head>
<body>
<h1>SAYED.exe</h1>
<p>WELCOME TO THE DEMO SYSTEM</p>
<div id="screen">
<p id="status">SYSTEM READY...</p>
<button id="start" onclick="start()">START</button>
<div id="progress"><div id="bar"></div></div>
<p id="percent">0%</p>
<div id="logs"></div>
<div id="result"></div>
</div>
<script>
function start() {
let button=document.getElementById("start");
let bar=document.getElementById("bar");
let percent=document.getElementById("percent");
let status=document.getElementById("status");
let logs=document.getElementById("logs");
let result=document.getElementById("result");

button.disabled=true;
button.innerText="RUNNING...";

let messages=[
"INITIALIZING DEMO...",
"LOADING VISUAL EFFECTS...",
"SCANNING DEMO INTERFACE...",
"RUNNING SIMULATION...",
"FINALIZING..."
];

let value=0;
let timer=setInterval(()=>{
value+=2;
bar.style.width=value+"%";
percent.innerText=value+"%";

if(value%20===0){
let msg=messages[value/20-1];
status.innerText=msg;
logs.innerHTML+="<p>> "+msg+"</p>";
}

if(value>=100){
clearInterval(timer);
status.innerText="SIMULATION COMPLETE";
result.innerHTML=
"<h2>ACCESS GRANTED</h2>"+
"<p>JUST A PRANK 😂</p>"+
"<h3>BY SAYED.exe</h3>";
button.innerText="COMPLETED";
}
},100);
}
</script>
</body>
</html>
